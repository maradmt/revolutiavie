<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Mihai Dodu</title>
</head>

<body style="
  margin:0;
  font-family:'Times New Roman', Times, serif;
  background:#fafafa;
  color:red;
">

  <!-- Background image with 35% opacity -->
  <div style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image: url('https://undevaincomunism.com/wp-content/uploads/2023/12/imagine-revolutie-2.jpg');
    background-size: cover;
    background-position: center;
    z-index:-1;
    opacity:0.35;
  "></div>

  <!-- Romanian Flag Banner (GRADUAL gradient, same size as main page) -->
  <div style="
    width:100%;
    padding:25px 0;
    text-align:center;
    font-size:1.7rem; /* same as main page */
    font-weight:bold;
    background: linear-gradient(
      90deg,
      #002B7F 0%,
      #1a4fa3 25%,
      #FCD116 50%,
      #f08a24 75%,
      #CE1126 100%
    );
    color:black;
    position:relative;
    z-index:1;
  ">
    Revoluția Română din 1989
  </div>

  <!-- White semi-transparent box for name and testimonial -->
  <div style="
    max-width:800px;
    margin:80px auto;
    background: rgba(255,255,255,0.8); /* 20% transparent */
    padding:30px;
    border-radius:8px;
    position:relative;
    z-index:1;
  ">
    <!-- Name -->
    <div style="
      font-size:2rem;
      font-weight:bold;
      margin-bottom:20px;
      color:red;
    ">
      Mihai Dodu
    </div>

    <!-- Testimonial -->
    <div style="
      font-size:1.2rem;
      line-height:1.6;
      color:red;
    ">
      Aici va fi mărturia completă
    </div>
  </div>

</body>
</html>
