<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revoluția Vie</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Banner */
    .banner {
      width: 100%;
      background: #222;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* Main content */
    .content {
      margin-top: 30px;
      width: 90%;
      max-width: 600px;
    }

    .testimonial-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .testimonial-list a {
      text-decoration: none;
      color: red;
      font-size: 1.2rem;
      padding: 10px 15px;
      border: 1px solid red;
      border-radius: 5px;
      transition: background 0.25s, color 0.25s;
    }

    .testimonial-list a:hover {
      background: red;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <div class="banner">
    Revoluția Română din 1989
  </div>

  <!-- Main content -->
  <div class="content">
    <h1>Revoluția Vie</h1>
    <p>Alege un testimonial:</p>

    <div class="testimonial-list">
      <a href="testimonial1.html">Nume Prenume 1</a>
      <a href="testimonial2.html">Nume Prenume 2</a>
      <a href="testimonial3.html">Nume Prenume 3</a>
      <a href="testimonial4.html">Nume Prenume 4</a>
      <a href="testimonial5.html">Nume Prenume 5</a>
    </div>
  </div>

</body>
</html>
